# Lint, format, build and test on every push to main and every pull request.
# The build step is also the type-check: `npm run build` runs `tsc -b` first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: documents-ai-ui
    steps:
      # package.json installs ai-chat-kit from ../ai-chat-kit, so check both out side by side.
      - uses: actions/checkout@v7
        with:
          path: documents-ai-ui

      - uses: actions/checkout@v7
        with:
          repository: CMSC-495-G7/ai-chat-kit
          path: ai-chat-kit
          # Add an AI_CHAT_KIT_TOKEN secret if ai-chat-kit is private.
          token: ${{ secrets.AI_CHAT_KIT_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documents-ai-ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
